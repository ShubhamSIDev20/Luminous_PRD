name: Battery Testing System - CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution (Release)
        run: dotnet build -c Release --no-restore

      - name: Publish Battery Testing System
        run: dotnet publish -c Release -o publish --no-build

      - name: Zip publish output
        run: zip -r BatteryTestingSystem-release.zip publish/

      - name: Upload build artifact (folder)
        uses: actions/upload-artifact@v4
        with:
          name: Battery-Testing-System
          path: publish

      - name: Upload release ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Battery-Testing-System-ZIP
          path: BatteryTestingSystem-release.zip

      - name: Create GitHub Release with ZIP
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.${{ github.run_number }}
          name: "BTS v0.5.${{ github.run_number }}"
          body: |
            🚀 Battery Testing System v0.5 - Automated release from commit ${{ github.sha }}
            
            **How to run manually:**
            1. Download `BatteryTestingSystem-release.zip`
            2. Extract the ZIP
            3. Run: `dotnet BatteryTestingSystem.dll`
            
            Or use Docker:
            ```
            docker pull ghcr.io/${{ github.actor }}/battery-testing-system:latest
            ```
          files: BatteryTestingSystem-release.zip
          token: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.actor }}/battery-testing-system:latest